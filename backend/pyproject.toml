[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "kisanpath"
version = "0.1.0"
description = "Provider-agnostic services for KisanPath"
requires-python = ">=3.11"
dependencies = [
  "httpx>=0.27,<1",
  "pydantic>=2.8,<3",
]

[project.optional-dependencies]
openai = ["openai>=2,<3"]
anthropic = ["anthropic>=0.86,<1"]
gemini = ["google-genai>=1,<2"]
providers = [
  "openai>=2,<3",
  "anthropic>=0.86,<1",
  "google-genai>=1,<2",
]
dev = [
  "mypy>=1.11,<2",
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<2",
  "ruff>=0.6,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["src/kisanpath"]

[tool.pytest.ini_options]
addopts = "-ra --strict-config --strict-markers"
asyncio_mode = "auto"
testpaths = ["tests"]
markers = [
  "live: opt-in tests that call real provider endpoints",
]

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "ASYNC"]

[tool.mypy]
python_version = "3.11"
strict = true
packages = ["kisanpath"]
plugins = ["pydantic.mypy"]

[[tool.mypy.overrides]]
module = ["openai.*", "anthropic.*", "google.*"]
ignore_missing_imports = true

name: kisanpath

services:
  postgres:
    image: postgres:16.4-alpine
    environment:
      POSTGRES_DB: kisanpath
      POSTGRES_USER: kisanpath
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-local-kisanpath-only}
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U kisanpath -d kisanpath"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - postgres-data:/var/lib/postgresql/data
    restart: unless-stopped

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--appendonly", "yes", "--maxmemory-policy", "noeviction"]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 20
    volumes:
      - redis-data:/data
    restart: unless-stopped

  migrate:
    build:
      context: ./backend
    command: ["alembic", "upgrade", "head"]
    environment:
      DATABASE_URL: postgresql+asyncpg://kisanpath:${POSTGRES_PASSWORD:-local-kisanpath-only}@postgres:5432/kisanpath
    depends_on:
      postgres:
        condition: service_healthy
    restart: "no"

  backend:
    build:
      context: ./backend
    environment:
      APP_ENV: ${APP_ENV:-development}
      APP_LOG_LEVEL: ${APP_LOG_LEVEL:-INFO}
      DATABASE_URL: postgresql+asyncpg://kisanpath:${POSTGRES_PASSWORD:-local-kisanpath-only}@postgres:5432/kisanpath
      REDIS_URL: redis://redis:6379/0
      KISANPATH_CORS_ORIGINS: '["http://localhost:3000"]'
      KISANPATH_ADMIN_TOKENS_JSON: ${KISANPATH_ADMIN_TOKENS_JSON:-}
      KISANPATH_LLM_CONFIG: /app/examples/llm.example.toml
      LLM_FALLBACK_ENABLED: ${LLM_FALLBACK_ENABLED:-true}
      LLM_EVALUATION_FALLBACK_ENABLED: ${LLM_EVALUATION_FALLBACK_ENABLED:-false}
      OPENAI_API_KEY: ${OPENAI_API_KEY:-}
      ANTHROPIC_API_KEY: ${ANTHROPIC_API_KEY:-}
      GEMINI_API_KEY: ${GEMINI_API_KEY:-}
      OLLAMA_BASE_URL: http://ollama:11434
    ports:
      - "8000:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/v1/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      migrate:
        condition: service_completed_successfully
      redis:
        condition: service_healthy
    stop_grace_period: 20s
    restart: unless-stopped

  frontend:
    build:
      context: ./frontend
      args:
        NEXT_PUBLIC_KISANPATH_API_URL: ${NEXT_PUBLIC_KISANPATH_API_URL:-}
    environment:
      NODE_ENV: production
    ports:
      - "3000:3000"
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://localhost:3000').then(r=>{if(!r.ok)process.exit(1)})"]
      interval: 10s
      timeout: 3s
      retries: 12
    depends_on:
      backend:
        condition: service_healthy
    stop_grace_period: 20s
    restart: unless-stopped

  ollama:
    image: ollama/ollama:0.11.4
    profiles: ["local-llm"]
    volumes:
      - ollama-data:/root/.ollama
    restart: unless-stopped

volumes:
  postgres-data:
  redis-data:
  ollama-data:
